<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم الإدارية | Tarek.Dev</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    h1 { color: #38bdf8; font-size: 1.8rem; margin: 0; }
    .back-btn { background: #334155; color: #fff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; }
    .msg-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .msg-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: #94a3b8; }
    .msg-name { font-weight: 700; color: #f8fafc; font-size: 1.1rem; }
    .msg-body { font-size: 1rem; line-height: 1.6; color: #e2e8f0; }
    .no-msg { text-align: center; color: #94a3b8; margin-top: 50px; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fa-solid fa-gauge-high"></i> لوحة تحكم رسائل العملاء</h1>
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> عودة للموقع</a>
    </header>

    <div id="messagesContainer">
      <p style="text-align: center; color: #94a3b8;">جاري تحميل الرسائل...</p>
    </div>
  </div>

  <script>
    async function fetchMessages() {
      try {
        const response = await fetch('https://tarek-portofolio-backend.onrender.com');
        const data = await response.json();

        const container = document.getElementById('messagesContainer');
        
        if (data.success && data.messages.length > 0) {
          container.innerHTML = '';
          data.messages.forEach(msg => {
            container.innerHTML += `
              <div class="msg-card">
                <div class="msg-header">
                  <span class="msg-name"><i class="fa-solid fa-user"></i> ${msg.name} (${msg.email})</span>
                  <span><i class="fa-regular fa-clock"></i> ${new Date(msg.created_at).toLocaleString()}</span>
                </div>
                <div class="msg-body">${msg.message}</div>
              </div>
            `;
          });
        } else {
          container.innerHTML = '<div class="no-msg">لا توجد رسائل مسجلة حتى الآن 📭</div>';
        }
      } catch (err) {
        console.error('خطأ في جلب الرسائل:', err);
        document.getElementById('messagesContainer').innerHTML = '<div class="no-msg" style="color: #ef4444;">تعذر الاتصال بالسيرفر وجلب الرسائل.</div>';
      }
    }

    fetchMessages();
  </script>
</body>
